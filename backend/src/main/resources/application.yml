server:
  port: 8080

spring:
  application:
    name: campus-event
  datasource:
    url: "${DB_URL:jdbc:mysql://127.0.0.1:3306/campus_event?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false}"
    username: "${DB_USERNAME:campus}"
    password: "${DB_PASSWORD:campus_dev_password}"
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

mybatis:
  mapper-locations: classpath:mappers/*.xml
  configuration:
    map-underscore-to-camel-case: true
    default-enum-type-handler: org.apache.ibatis.type.EnumTypeHandler

springdoc:
  swagger-ui:
    path: /swagger-ui.html

management:
  endpoints:
    web:
      exposure:
        include: health,info

app:
  jwt:
    secret: "${JWT_SECRET:dev-only-jwt-secret-change-this-32-bytes-minimum}"
    expiration-minutes: 120
  waitlist:
    confirmation-minutes: 10
    expiry-scan-ms: 30000
  check-in:
    secret: "${CHECKIN_SECRET:dev-only-checkin-secret-change-this-32-bytes}"
    token-ttl-minutes: 5
  seed:
    enabled: true
